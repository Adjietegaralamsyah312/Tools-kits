name: validate
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static site validation (no build)
        run: |
          python3 - <<'PY'
          import html.parser, pathlib, re, sys, xml.etree.ElementTree as ET
          root = pathlib.Path(".")
          base = "https://adjietegaralamsyah312.github.io/Tools-kits"
          fails = []
          def fail(m):
            fails.append(m); print("FAIL:", m)
          # 1. HTML parse
          class P(html.parser.HTMLParser):
            def error(self, m): raise Exception(m)
          htmls = list(root.glob("*.html")) + list(root.glob("tools/**/*.html")) + list(root.glob("blog/*.html"))
          print(f"HTML files: {len(htmls)}")
          for f in htmls:
            try:
              P().feed(f.read_text(encoding="utf-8"))
            except Exception as e:
              fail(f"{f}: HTML parse error {e}")
          # 2. Old domain + dangerous JS — APP SOURCE ONLY.
          # Do NOT scan README.md / *.md / docs / CI files (.github/):
          # they legitimately document these patterns
          # (e.g. "No eval()", old-domain migration notes).
          app_js = list(root.glob("assets/**/*.js")) + list(root.glob("tools/**/*.js"))
          site_meta = [root/"sitemap.xml", root/"robots.txt", root/"manifest.webmanifest"]
          txt_all = []
          for f in list(htmls) + app_js + site_meta:
            if f.exists() and f.is_file(): txt_all.append((str(f), f.read_text(encoding="utf-8", errors="replace")))
          for name, t in txt_all:
            if "toolskits.pages.dev" in t.lower(): fail(f"{name}: contains old domain toolskits.pages.dev")
            if re.search(r"eval\s*\(", t): fail(f"{name}: contains eval(")
            if "new Function(" in t: fail(f"{name}: contains new Function(")
          # 3. Sitemap valid + URL format + canonical
          try:
            tree = ET.parse("sitemap.xml")
            locs = [e.text.strip() for e in tree.getroot().iter() if e.tag.endswith("loc")]
            print(f"sitemap URLs: {len(locs)}")
            for u in locs:
              if not u.startswith(base + "/") and u.rstrip("/") != base.rstrip("/"):
                if not u.startswith(base):
                  fail(f"sitemap URL not under base: {u}")
              if "toolskits.pages.dev" in u: fail(f"sitemap old domain: {u}")
          except Exception as e:
            fail(f"sitemap.xml INVALID: {e}")
          # 4. Required metadata + canonical GitHub Pages
          req = ["<title>", 'name="description"', "rel=\"canonical\"", 'property="og:title"', 'property="og:description"', 'property="og:url"', 'property="og:image"', 'name="twitter:card"']
          for f in htmls:
            if f.name == "404.html": continue
            t = f.read_text(encoding="utf-8")
            for r in req:
              if r not in t: fail(f"{f}: missing {r}")
            m = re.search(r'<link rel="canonical" href="([^"]+)"', t)
            if not m: fail(f"{f}: missing canonical")
            elif not m.group(1).startswith(base): fail(f"{f}: canonical not GitHub Pages: {m.group(1)}")
            if "toolskits.pages.dev" in t: fail(f"{f}: old domain in HTML")
          # 5. Registry vs directory vs sitemap vs /tools ItemList
          import json
          m = re.search(r"window\.TOOLS\s*=\s*(\[.*?\]);", (root/"assets/js/tools-data.js").read_text(), re.S)
          reg = json.loads(re.sub(r"([{,])(\w+):", r'\1"\2":', m.group(1))) if m else []
          slugs = sorted(t["slug"] for t in reg)
          dirs = sorted(p.name for p in (root/"tools").iterdir() if p.is_dir())
          print(f"registry={len(slugs)} dirs={len(dirs)}")
          if slugs != dirs: fail(f"registry vs dirs mismatch: {slugs} vs {dirs}")
          if len(slugs) != 20: fail(f"tool count != 20: {len(slugs)}")
          if (root/"tools"/"lorem-ipsum").exists(): fail("tools/lorem-ipsum must be deleted (replaced by jwt-decoder)")
          sm = " ".join(locs)
          for s in slugs:
            if f"/tools/{s}/" not in sm: fail(f"sitemap missing tool {s}")
          ti = (root/"tools/index.html").read_text()
          for s in slugs:
            if s not in ti: fail(f"tools/index.html missing {s}")
          # 6. Relative asset paths (static check)
          for f in htmls:
            t = f.read_text(encoding="utf-8")
            if f.name == "404.html":
              for asset in ["/Tools-kits/assets/css/style.css", "/Tools-kits/favicon.svg"]:
                if asset not in t: fail(f"{f}: missing {asset}")
              continue
            depth = len(f.parent.relative_to(root).parts) if f.parent != root else 0
            prefix = "../" * depth if depth else ""
            # css/js/favicon expectations by depth
            for asset in [f"{prefix}assets/css/style.css", f"{prefix}assets/js/main.js", f"{prefix}favicon.svg"]:
              if asset not in t: fail(f"{f}: missing {asset}")
          print("done")
          if fails:
            print(f"{len(fails)} FAILURES"); sys.exit(1)
          print("ALL CHECKS PASSED")
          PY
