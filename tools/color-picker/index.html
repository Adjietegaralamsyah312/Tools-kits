<div class="tool-layout"><div>
<div class="panel">
<label class="lbl" for="pick">Pick a color</label>
<input type="color" id="pick" value="#2563eb" style="width:100%;height:56px;border:1px solid var(--border);border-radius:10px;background:var(--bg)">

<script>
document.addEventListener("DOMContentLoaded",function(){
  var pick=document.getElementById("pick"),hex=document.getElementById("hex"),rgb=document.getElementById("rgb"),hsl=document.getElementById("hsl"),prev=document.getElementById("prev"),msg=document.getElementById("msg");
  function clamp(n,a,b){return Math.min(b,Math.max(a,n));}
  function hexToRgb(h){h=h.trim().replace("#","");if(h.length===3)h=h.split("").map(function(c){return c+c;}).join("");if(!/^[0-9a-fA-F]{6}$/.test(h))return null;return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
  function rgbToHex(r,g,b){return"#"+[r,g,b].map(function(n){return clamp(Math.round(n),0,255).toString(16).padStart(2,"0");}).join("");}
  function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return{h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};}
  function hslToRgb(h,s,l){h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}return{r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)};}
  function render(r,g,b,src){
    var h=rgbToHex(r,g,b),hslv=rgbToHsl(r,g,b);
    if(src!=="pick")pick.value=h;
    if(src!=="hex")hex.value=h;
    if(src!=="rgb")rgb.value="rgb("+r+", "+g+", "+b+")";
    if(src!=="hsl")hsl.value="hsl("+hslv.h+", "+hslv.s+"%, "+hslv.l+"%)";
    prev.style.background=h;msg.hidden=true;
  }
  pick.addEventListener("input",function(){var c=hexToRgb(pick.value);if(c)render(c.r,c.g,c.b,"pick");});
  hex.addEventListener("input",function(){var c=hexToRgb(hex.value);if(c)render(c.r,c.g,c.b,"hex");});
  rgb.addEventListener("input",function(){var m=rgb.value.match(/(\d{1,3})[^\d]+(\d{1,3})[^\d]+(\d{1,3})/);if(m)render(+m[1],+m[2],+m[3],"rgb");});
  hsl.addEventListener("input",function(){var m=hsl.value.match(/(-?\d+)[^\d]+(\d+)[^\d]+(\d+)/);if(m){var c=hslToRgb(+m[1],+m[2],+m[3]);render(c.r,c.g,c.b,"hsl");}});
  document.querySelectorAll("[data-copy]").forEach(function(b){b.addEventListener("click",function(){var id=b.getAttribute("data-copy");window.tkCopy(document.getElementById(id).value,msg);});});
  render(37,99,235);
});
</script>
