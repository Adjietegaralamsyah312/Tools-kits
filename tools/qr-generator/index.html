<h1>QR Generator</h1>
<p style="color:var(--muted)">Text or URL → QR → download PNG. Library loads only on this page.</p>
<div class="tool-layout"><div>
<div class="panel">
<label class="lbl" for="in">Text / URL</label><textarea class="ta short" id="in" placeholder="https://example.com">https://adjietegaralamsyah312.github.io/Tools-kits/</textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem">
<div><label class="lbl" for="size">Size (px)</label><input class="in" type="number" id="size" value="256" min="128" max="1024"></div>
<div><label class="lbl" for="ec">Error correction</label><select class="sel" id="ec"><option value="M">M — standard</option><option value="L">L — low</option><option value="Q">Q — high</option><option value="H">H — highest</option></select></div>
</div>
<div class="row"><button class="btn primary" id="bGo">Generate</button><button class="btn" id="bDl" disabled>Download PNG</button></div>
<div class="alert" id="msg" hidden role="status"></div>
<div style="text-align:center;margin-top:.8rem"><canvas id="qr" width="256" height="256" style="border:1px solid var(--border);border-radius:12px;max-width:100%" role="img" aria-label="QR code preview"></canvas></div>
</div>
<article class="prose"><h2>How to use</h2><ol><li>Enter text/URL.</li><li>Click Generate.</li><li>Download PNG.</li></ol>
<h2>Related tools</h2><div class="related" id="relatedTools" data-tool="qr-generator"></div></article>
</div><aside class="sidebar"><div class="ad-slot" data-slot="sidebar" aria-hidden="true">AdSlot · sidebar</div></aside></div>

<script src="../../assets/js/tools-data.js" defer></script><script src="../../assets/js/main.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  var inp=document.getElementById("in"),size=document.getElementById("size"),ec=document.getElementById("ec"),
  go=document.getElementById("bGo"),dl=document.getElementById("bDl"),msg=document.getElementById("msg"),cv=document.getElementById("qr");
  function say(t,ok){msg.hidden=false;msg.textContent=t;msg.className="alert "+(ok?"success":"error");}
  function draw(){
    var v=inp.value.trim();if(!v){say("Please enter text or URL first.",false);return;}
    if(typeof qrcode==="undefined"){say("QR library failed to load (offline/CDN blocked). Check connection and reload.",false);return;}
    var s=Math.min(1024,Math.max(128,parseInt(size.value,10)||256));
    try{
      var qr=qrcode(0,ec.value);qr.addData(v);qr.make();
      var n=qr.getModuleCount(),ctx=cv.getContext("2d");cv.width=s;cv.height=s;
      ctx.fillStyle="#fff";ctx.fillRect(0,0,s,s);ctx.fillStyle="#000";
      var cell=s/n;for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect(Math.floor(c*cell),Math.floor(r*cell),Math.ceil(cell),Math.ceil(cell));
      dl.disabled=false;say("QR generated ("+s+"×"+s+").",true);
    }catch(e){say("Could not generate QR (text too long for this error level?). Try shorter text or level L.",false);}
  }
  go.addEventListener("click",draw);
  dl.addEventListener("click",function(){var a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download="qr.png";document.body.appendChild(a);a.click();a.remove();});
  draw();
});
</script>
