<h1>Case Converter</h1>
<p style="color:var(--muted)">Convert between 7 common cases instantly.</p>
<div class="tool-layout"><div>
<div class="panel">
<label class="lbl" for="in">Input</label><textarea class="ta short" id="in" placeholder="hello world example"></textarea>
<div class="row">
<button class="btn" data-case="upper">UPPERCASE</button><button class="btn" data-case="lower">lowercase</button>
<button class="btn" data-case="title">Title Case</button><button class="btn" data-case="sentence">Sentence case</button>
<button class="btn" data-case="camel">camelCase</button><button class="btn" data-case="snake">snake_case</button>
<button class="btn" data-case="kebab">kebab-case</button>
</div>
<div class="row"><button class="btn primary" id="bCopy">Copy result</button><button class="btn ghost" id="bClear">Clear</button></div>
<div class="alert" id="msg" hidden role="status"></div>
<label class="lbl" for="out">Result</label><div class="output" id="out" tabindex="0" aria-live="polite">Result will appear here.</div>
</div>

<script>
document.addEventListener("DOMContentLoaded",function(){
  var i=document.getElementById("in"),o=document.getElementById("out"),m=document.getElementById("msg");
  function words(s){return s.trim().split(/[\s_\-]+/).filter(Boolean);}
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();}
  var fn={
    upper:function(s){return s.toUpperCase();},
    lower:function(s){return s.toLowerCase();},
    title:function(s){return words(s).map(cap).join(" ");},
    sentence:function(s){var t=s.toLowerCase().trim();return t.charAt(0).toUpperCase()+t.slice(1);},
    camel:function(s){var w=words(s.toLowerCase());return w.map(function(x,k){return k===0?x:cap(x);}).join("");},
    snake:function(s){return words(s).join("_").toLowerCase();},
    kebab:function(s){return words(s).join("-").toLowerCase();}
  };
  document.querySelectorAll("[data-case]").forEach(function(b){b.addEventListener("click",function(){
    if(!i.value){m.hidden=false;m.textContent="Please enter some text first.";m.className="alert error";return;}
    o.textContent=fn[b.getAttribute("data-case")](i.value);m.hidden=true;
  });});
  document.getElementById("bCopy").addEventListener("click",function(){window.tkCopy(o.textContent,m);});
  document.getElementById("bClear").addEventListener("click",function(){i.value="";o.textContent="Result will appear here.";});
});
</script>
